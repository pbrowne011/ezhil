<!DOCTYPE html>
<html>
{{ partial "header.html" . }}
<body>
	<div class="container wrapper post">
		{{ partial "head.html" . }}
		<div class="post-header">
			<h1 class="title">{{ .Title }}</h1>
		</div>

		<style>
			.project {
				display: flex;
				gap: 1.5rem;
				margin-bottom: 3rem;
			}
			
			.project-image {
				flex: 0 0 200px;
			}
			
			.project-image img,
			.placeholder-img {
				width: 100%;
				height: 150px;
				border-radius: 4px;
				object-fit: cover;
				background: var(--light-background);
			}
			
			.project-content {
				flex: 1;
				min-width: 0; /* Prevents flex item from overflowing */
			}
			
			.project-title {
				margin: 0 0 0.5rem 0;
				font-size: 1.25rem;
				color: var(--heading-color);
			}
			
			.project-description {
				margin: 0.5rem 0;
				line-height: 1.5;
			}

			.project-tags {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin-top: 0.75rem;
			}

			.tag {
				background: rgba(128, 128, 128, 0.1);
				padding: 0.25rem 0.75rem;
				border-radius: 1rem;
				font-size: 0.875rem;
				color: var(--text-color);
			}
/*
			.repo-link {
				color: var(--text-color);
				text-decoration: none;
				opacity: 0.7;
				transition: opacity 0.2s;
				margin-left: 0.5rem;
			} */

                        .repo-link {
                            display: inline-flex;
                            align-items: center;
                            padding: 0.25rem 0.75rem;
                            margin-left: 0.75rem;
                            border: 1px solid #a00;
                            border-radius: 4px;
                            font-size: 0.85em;
                            opacity: 0.8;
                            transition: all 0.2s ease;
                        }
                        
/*			.repo-link:hover {
				opacity: 1;
			}
*/
                        
                        .repo-link:hover {
                        opacity: 1;
                        text-decoration: none;
                        background: rgba(128, 128, 128, 0.1);
                        }
                        
			/* Responsive styles */
			@media (max-width: 768px) {
				.project {
					flex-direction: column;
					gap: 1rem;
				}

				.project-image {
					flex: none;
					max-width: 100%;
				}

				.project-image img,
				.placeholder-img {
					height: 200px;
				}
			}

			/* Dark mode specific styles */
			@media (prefers-color-scheme: dark) {
				.tag {
					background: var(--dark-background, #2d2d2d);
				}

				.placeholder-img {
					background: var(--dark-background, #2d2d2d);
				}
			}
		</style>

		<div class="markdown">
			{{ .Content }}
		</div>
	</div>
	{{ partial "footer.html" . }}
</body>
</html>
